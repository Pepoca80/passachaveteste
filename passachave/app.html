<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha área – Passachave</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="topo">
      <a class="brand" href="index.html"><span class="logo"></span>Passachave</a>
      <div class="usuario">
        <span id="usuario-nome"></span>
        <button class="btn s" data-acao="aba" data-aba="perfil">Meu perfil</button>
        <button id="btn-sair" class="btn s">Sair</button>
      </div>
    </header>

    <div class="modo" role="group" aria-label="O que você quer fazer">
      <button data-acao="modo" data-modo="alugar">Quero alugar</button>
      <button data-acao="modo" data-modo="anunciar">Quero anunciar</button>
    </div>
    <nav class="abas" id="abas"></nav>

    <main id="conteudo"><div class="carregando">Carregando…</div></main>
  </div>

  <dialog id="dlg" class="dlg" aria-labelledby="dlg-titulo">
    <h2 id="dlg-titulo"></h2>
    <pre id="dlg-texto" class="contrato-texto"></pre>
    <div class="row dlg-rodape">
      <button class="btn" data-acao="imprimir">Imprimir / salvar em PDF</button>
      <button class="btn p" data-acao="fechar">Fechar</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
